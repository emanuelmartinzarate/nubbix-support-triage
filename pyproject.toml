[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nubbix-triage"
version = "0.1.0"
description = "Triage de primer nivel de soporte para Nubbix con LLMs"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triage = ["pricing.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
