# Precios por millón de tokens (USD), tarifa estándar pagada.
# Costo de un request = (input_tokens * input + output_tokens * output) / 1_000_000
# En Gemini los tokens de "thinking" se facturan como salida y se suman a output_tokens.
models:
  claude-haiku-5-5:
    provider: anthropic
    input_usd_per_mtok: 0.10   # prompts <= 100K tokens
    output_usd_per_mtok: 0.50
    source_url: https://platform.claude.com/docs/en/about-claude/pricing
    retrieved: "2026-10-22"
  claude-sonnet-5-5:
    provider: anthropic
    input_usd_per_mtok: 2.00
    output_usd_per_mtok: 10.00
    source_url: https://platform.claude.com/docs/en/about-claude/pricing
    retrieved: "2026-10-22"
  gemini-3.8-flash:
    provider: gemini
    input_usd_per_mtok: 0.75   # vigente hasta 2026-12-31 (sube a 1.50 desde 2027-01-01)
    output_usd_per_mtok: 3.75  # incluye thinking (sube a 7.50 desde 2027-01-01)
    source_url: https://ai.google.dev/gemini-api/docs/pricing
    retrieved: "2026-10-22"
  gemini-3.1-flash-lite:
    provider: gemini
    input_usd_per_mtok: 0.25
    output_usd_per_mtok: 1.50
    source_url: https://ai.google.dev/gemini-api/docs/pricing
    retrieved: "2026-10-22"
  gemini-3.1-pro-preview:
    provider: gemini
    input_usd_per_mtok: 2.00   # prompts <= 200K tokens
    output_usd_per_mtok: 12.00
    source_url: https://ai.google.dev/gemini-api/docs/pricing
    retrieved: "2026-10-22"
